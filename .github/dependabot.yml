version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '04:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      typescript-runtime-minor-patch:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      typescript-development-minor-patch:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /sdks/python
    schedule:
      interval: weekly
      day: wednesday
      time: '04:20'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      python-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '04:40'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
