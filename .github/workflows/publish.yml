name: Publish Packages

on:
  push:
    tags:
      - 'typescript-v*'
      - 'python-v*'

permissions:
  contents: read

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --force origin +refs/heads/main:refs/remotes/origin/main

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install docpact
        run: cargo install docpact --version 0.1.9 --force

      - name: Run docpact release gate
        run: |
          set -euo pipefail
          release_head="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          release_base="$(git rev-parse "${release_head}^")"
          scripts/docpact-gate.sh --base "$release_base" --head "$release_head"

  typescript-publish:
    name: Publish TypeScript package
    if: startsWith(github.ref_name, 'typescript-v')
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Validate release tag
        run: ./scripts/ci/check-release-tag.sh typescript

      - name: Check TypeScript registry version availability
        run: python3 ./scripts/ci/release-version.py assert-unpublished --package typescript

      - name: Verify TypeScript package
        run: ./scripts/ci/verify-typescript-package.sh

      - name: Publish to npm
        run: pnpm --filter @tiangong-lca/tidas-sdk --fail-if-no-match publish --access public --provenance --no-git-checks

  python-build:
    name: Build Python distributions
    if: startsWith(github.ref_name, 'python-v')
    needs: release-gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: auto
          prune-cache: false

      - name: Validate release tag
        run: ./scripts/ci/check-release-tag.sh python

      - name: Check Python registry version availability
        run: python3 ./scripts/ci/release-version.py assert-unpublished --package python

      - name: Verify Python package
        run: ./scripts/ci/verify-python-package.sh

      - name: Upload Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: sdks/python/dist/*
          if-no-files-found: error
          archive: true

  python-publish:
    name: Publish Python package
    if: startsWith(github.ref_name, 'python-v')
    needs:
      - python-build
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
          skip-decompress: false
          digest-mismatch: error

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
