name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/dependabot.yml
      - .github/workflows/**
      - .nvmrc
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - sdks/typescript/package.json
      - sdks/typescript/examples/package.json
      - sdks/python/pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check automation before package bootstrap
        run: python3 ./scripts/ci/test-automation-contracts.py

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Verify TypeScript package
        run: ./scripts/ci/verify-typescript-package.sh

  python:
    name: Python package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify Python package
        run: ./scripts/ci/verify-python-package.sh
