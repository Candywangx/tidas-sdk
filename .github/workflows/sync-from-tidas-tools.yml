name: Sync From tidas-tools

on:
  repository_dispatch:
    types:
      - tidas_tools_changed
      - tidas_spec_released
  workflow_dispatch:
    inputs:
      tidas_tools_sha:
        description: Exact 40-character tiangong-lca/tidas-toolkit commit SHA to sync from.
        required: false
        type: string
      packages:
        description: Package families to regenerate.
        required: true
        default: both
        type: choice
        options:
          - both
          - typescript
          - python
      typescript_bump:
        description: TypeScript version bump level.
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      python_bump:
        description: Python version bump level.
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      reason:
        description: Optional note explaining why this sync is running.
        required: false
        type: string

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      AUTOMATION_TOKEN: ${{ secrets.TIDAS_RELEASE_AUTOMATION_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate automation token
        run: |
          if [ -z "$AUTOMATION_TOKEN" ]; then
            echo "error: missing TIDAS_RELEASE_AUTOMATION_TOKEN secret" >&2
            exit 1
          fi

      - name: Resolve sync request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          INPUT_TIDAS_TOOLS_SHA: ${{ github.event.inputs.tidas_tools_sha }}
          INPUT_PACKAGES: ${{ github.event.inputs.packages }}
          INPUT_TYPESCRIPT_BUMP: ${{ github.event.inputs.typescript_bump }}
          INPUT_PYTHON_BUMP: ${{ github.event.inputs.python_bump }}
          INPUT_REASON: ${{ github.event.inputs.reason }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event_name = os.environ["EVENT_NAME"]
          outputs_path = Path(os.environ["GITHUB_OUTPUT"])

          requested_sha = ""
          requested_packages = {"typescript", "python"}
          ts_bump = "patch"
          py_bump = "patch"
          reason = ""
          source_event = "tools"
          update_tools_pin = "true"
          spec_version = ""
          spec_source_commit = ""
          spec_archive_url = ""
          spec_archive_sha256 = ""
          spec_manifest_sha256 = ""
          spec_event_key = ""

          if event_name == "repository_dispatch":
              with Path(os.environ["EVENT_PATH"]).open("r", encoding="utf-8") as fh:
                  event = json.load(fh)
              event_type = str(event.get("action", "") or "")
              payload = event.get("client_payload", {})
              if event_type not in {"tidas_tools_changed", "tidas_spec_released"}:
                  raise SystemExit(f"error: unsupported repository_dispatch action {event_type!r}")
              source_event = "spec" if event_type == "tidas_spec_released" else "tools"
              update_tools_pin = "false" if source_event == "spec" else "true"
              requested_sha = str(payload.get("tidas_tools_sha", "") or "")
              release_options = payload.get("release_options", {}) if source_event == "spec" else {}
              if not isinstance(release_options, dict):
                  raise SystemExit("error: release_options must be an object")
              packages = release_options.get("packages", payload.get("packages", ["typescript", "python"]))
              if isinstance(packages, str):
                  packages = [packages]
              requested_packages = set(packages)
              ts_bump = str(release_options.get("typescript_bump", payload.get("typescript_bump", "patch")) or "patch")
              py_bump = str(release_options.get("python_bump", payload.get("python_bump", "patch")) or "patch")
              reason = str(payload.get("reason", "") or "")
              if source_event == "spec":
                  spec_package = str(payload.get("package", "") or "")
                  if spec_package != "@tiangong-lca/tidas-spec":
                      raise SystemExit("error: tidas_spec_released package must be @tiangong-lca/tidas-spec")
                  spec_version = str(payload.get("version", "") or "")
                  spec_source_commit = str(payload.get("source_commit", "") or "")
                  spec_archive_url = str(payload.get("archive_url", "") or "")
                  spec_archive_sha256 = str(payload.get("archive_sha256", "") or "")
                  spec_manifest_sha256 = str(payload.get("manifest_sha256", "") or "")
                  spec_event_key = str(payload.get("event_key", "") or "")
                  if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", spec_version):
                      raise SystemExit("error: spec version is not semantic")
                  if not re.fullmatch(r"[0-9a-f]{40}", spec_source_commit):
                      raise SystemExit("error: spec source_commit must be a lowercase 40-character SHA")
                  if not re.fullmatch(r"[0-9a-f]{64}", spec_archive_sha256) or not re.fullmatch(r"[0-9a-f]{64}", spec_manifest_sha256):
                      raise SystemExit("error: spec archive and manifest digests must be lowercase SHA256 values")
                  expected_file = f"tiangong-lca-tidas-spec-{spec_version}.tgz"
                  expected_url = f"https://github.com/tiangong-lca/tidas-spec/releases/download/v{spec_version}/{expected_file}"
                  expected_key = f"@tiangong-lca/tidas-spec@{spec_version}:{spec_archive_sha256}:{spec_manifest_sha256}"
                  if str(payload.get("archive_file", "")) != expected_file or spec_archive_url != expected_url or spec_event_key != expected_key:
                      raise SystemExit("error: spec release payload does not carry the canonical immutable identity")
                  pin_text = Path("scripts/ci/lib/tidas-tools-source.sh").read_text(encoding="utf-8")
                  pin_match = re.search(r'TIDAS_TOOLS_SHA="\$\{TIDAS_TOOLS_SHA:-([0-9a-fA-F]{40})\}"', pin_text)
                  if pin_match is None:
                      raise SystemExit("error: could not resolve current exact tidas-tools pin for spec event")
                  requested_sha = pin_match.group(1).lower()
          else:
              requested_sha = os.environ.get("INPUT_TIDAS_TOOLS_SHA", "")
              packages = os.environ.get("INPUT_PACKAGES", "both")
              if packages == "typescript":
                  requested_packages = {"typescript"}
              elif packages == "python":
                  requested_packages = {"python"}
              else:
                  requested_packages = {"typescript", "python"}
              ts_bump = os.environ.get("INPUT_TYPESCRIPT_BUMP", "patch") or "patch"
              py_bump = os.environ.get("INPUT_PYTHON_BUMP", "patch") or "patch"
              reason = os.environ.get("INPUT_REASON", "") or ""

          requested_typescript = "typescript" in requested_packages
          requested_python = "python" in requested_packages
          if not re.fullmatch(r"[0-9a-fA-F]{40}", requested_sha):
              raise SystemExit(
                  "error: tidas_tools_sha must be an exact 40-character commit SHA"
              )

          with outputs_path.open("a", encoding="utf-8") as fh:
              fh.write(f"requested_sha={requested_sha}\n")
              fh.write(f"requested_typescript={'true' if requested_typescript else 'false'}\n")
              fh.write(f"requested_python={'true' if requested_python else 'false'}\n")
              fh.write(f"source_event={source_event}\n")
              fh.write(f"update_tools_pin={update_tools_pin}\n")
              fh.write(f"spec_version={spec_version}\n")
              fh.write(f"spec_source_commit={spec_source_commit}\n")
              fh.write(f"spec_archive_url={spec_archive_url}\n")
              fh.write(f"spec_archive_sha256={spec_archive_sha256}\n")
              fh.write(f"spec_manifest_sha256={spec_manifest_sha256}\n")
              fh.write(f"spec_event_key={spec_event_key}\n")
              fh.write(f"typescript_bump={ts_bump}\n")
              fh.write(f"python_bump={py_bump}\n")
              fh.write("reason<<EOF\n")
              fh.write(f"{reason}\n")
              fh.write("EOF\n")
          PY

      - name: Clone upstream tidas-tools
        id: upstream
        env:
          REQUESTED_SHA: ${{ steps.request.outputs.requested_sha }}
          SOURCE_EVENT: ${{ steps.request.outputs.source_event }}
          SPEC_VERSION: ${{ steps.request.outputs.spec_version }}
        run: |
          set -euo pipefail

          SOURCE_EVENT="${SOURCE_EVENT:-tools}"
          SPEC_VERSION="${SPEC_VERSION:-}"

          UPSTREAM_DIR="$RUNNER_TEMP/tidas-tools-upstream"
          CLONE_URL="https://github.com/tiangong-lca/tidas-toolkit.git"

          rm -rf "$UPSTREAM_DIR"
          git clone --quiet "$CLONE_URL" "$UPSTREAM_DIR"

          git -C "$UPSTREAM_DIR" checkout --detach "$REQUESTED_SHA"

          RESOLVED_SHA="$(git -C "$UPSTREAM_DIR" rev-parse HEAD)"
          if [ "$(printf '%s' "$RESOLVED_SHA" | tr '[:upper:]' '[:lower:]')" != "$(printf '%s' "$REQUESTED_SHA" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "error: resolved upstream commit does not match the request" >&2
            exit 1
          fi
          SHORT_SHA="${RESOLVED_SHA:0:7}"
          if [ "$SOURCE_EVENT" = spec ]; then
            BRANCH_NAME="automation/tidas-spec-sync-v${SPEC_VERSION}"
          else
            BRANCH_NAME="automation/tidas-tools-sync-$SHORT_SHA"
          fi

          {
            echo "path=$UPSTREAM_DIR"
            echo "resolved_sha=$RESOLVED_SHA"
            echo "short_sha=$SHORT_SHA"
            echo "branch_name=$BRANCH_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch and pin exact tidas-spec release
        if: steps.request.outputs.source_event == 'spec'
        env:
          EVENT_PATH: ${{ github.event_path }}
          SPEC_ARCHIVE_URL: ${{ steps.request.outputs.spec_archive_url }}
          SPEC_ARCHIVE_SHA256: ${{ steps.request.outputs.spec_archive_sha256 }}
          SPEC_MANIFEST_SHA256: ${{ steps.request.outputs.spec_manifest_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["client_payload"]["archive_file"])' "$EVENT_PATH")"
          curl --fail --silent --show-error --location --retry 3 "$SPEC_ARCHIVE_URL" --output "$archive"
          test "$(shasum -a 256 "$archive" | awk '{print $1}')" = "$SPEC_ARCHIVE_SHA256"
          manifest="$RUNNER_TEMP/tidas-spec-manifest.json"
          tar -xOf "$archive" package/spec-manifest.json > "$manifest"
          test "$(shasum -a 256 "$manifest" | awk '{print $1}')" = "$SPEC_MANIFEST_SHA256"
          python3 ./scripts/ci/update-tidas-spec-pin.py --event-file "$EVENT_PATH"
          python3 ./scripts/ci/update-tidas-public-rules-pin.py --archive "$archive"
          echo "TIDAS_SPEC_ARCHIVE_PATH=$archive" >> "$GITHUB_ENV"

      - name: Set up pnpm and Node.js
        if: steps.request.outputs.requested_typescript == 'true'
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Set up Python
        if: steps.request.outputs.requested_python == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        if: steps.request.outputs.requested_python == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: auto
          prune-cache: false

      - name: Regenerate TypeScript SDK
        if: steps.request.outputs.requested_typescript == 'true'
        env:
          TIDAS_TOOLS_SOURCE_MODE: auto
          TIDAS_TOOLS_PATH: ${{ steps.upstream.outputs.path }}
          TIDAS_TOOLS_SHA: ${{ steps.upstream.outputs.resolved_sha }}
        run: ./scripts/ci/generate-typescript-sdk.sh

      - name: Regenerate Python SDK
        if: steps.request.outputs.requested_python == 'true'
        env:
          TIDAS_TOOLS_SOURCE_MODE: auto
          TIDAS_TOOLS_PATH: ${{ steps.upstream.outputs.path }}
          TIDAS_TOOLS_SHA: ${{ steps.upstream.outputs.resolved_sha }}
        run: ./scripts/ci/generate-python-sdk.sh

      - name: Detect changed packages
        id: changes
        run: |
          set -euo pipefail

          package_changed() {
            local target="$1"
            if [ -n "$(git status --porcelain -- "$target")" ]; then
              echo "true"
            else
              echo "false"
            fi
          }

          TS_CHANGED="$(package_changed sdks/typescript)"
          PY_CHANGED="$(package_changed sdks/python)"
          SPEC_PIN_CHANGED="$(package_changed scripts/ci/tidas-spec-pin.json)"

          {
            echo "typescript_changed=$TS_CHANGED"
            echo "python_changed=$PY_CHANGED"
            echo "spec_pin_changed=$SPEC_PIN_CHANGED"
          } >> "$GITHUB_OUTPUT"

          if [ "$TS_CHANGED" = "true" ] || [ "$PY_CHANGED" = "true" ] || [ "$SPEC_PIN_CHANGED" = "true" ]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when generated output is unchanged
        if: steps.changes.outputs.any_changed != 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.resolved_sha }}
        run: echo "No SDK artifacts changed for upstream $UPSTREAM_SHA."

      - name: Resolve TypeScript release version
        if: steps.changes.outputs.typescript_changed == 'true'
        id: typescript_release
        env:
          TYPESCRIPT_BUMP: ${{ steps.request.outputs.typescript_bump }}
        run: |
          set -euo pipefail
          TYPESCRIPT_VERSION="$(
            python3 ./scripts/ci/release-version.py next-version \
              --package typescript \
              --part "$TYPESCRIPT_BUMP"
          )"
          echo "version=$TYPESCRIPT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump TypeScript package version
        if: steps.changes.outputs.typescript_changed == 'true'
        env:
          TYPESCRIPT_VERSION: ${{ steps.typescript_release.outputs.version }}
        run: pnpm --filter @tiangong-lca/tidas-sdk --fail-if-no-match version "$TYPESCRIPT_VERSION" --no-git-tag-version --no-git-checks

      - name: Resolve Python release version
        if: steps.changes.outputs.python_changed == 'true'
        id: python_release
        env:
          PYTHON_BUMP: ${{ steps.request.outputs.python_bump }}
        run: |
          set -euo pipefail
          PYTHON_VERSION="$(
            python3 ./scripts/ci/release-version.py next-version \
              --package python \
              --part "$PYTHON_BUMP"
          )"
          echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump Python package version
        if: steps.changes.outputs.python_changed == 'true'
        env:
          PYTHON_VERSION: ${{ steps.python_release.outputs.version }}
        run: python3 ./scripts/ci/bump-python-version.py --version "$PYTHON_VERSION"

      - name: Update default exact upstream pin
        if: steps.changes.outputs.any_changed == 'true' && steps.request.outputs.update_tools_pin == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.resolved_sha }}
        run: |
          python3 ./scripts/ci/update-tidas-tools-pin.py \
            --upstream-sha "$UPSTREAM_SHA"

      - name: Record generated SDK documentation review
        if: steps.changes.outputs.any_changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.resolved_sha }}
        run: |
          REVIEWED_AT="$(git show -s --format=%cs "$GITHUB_SHA")"
          python3 ./scripts/ci/mark-generated-doc-review.py \
            --reviewed-at "$REVIEWED_AT" \
            --reviewed-commit "$GITHUB_SHA" \
            --upstream-sha "$UPSTREAM_SHA"

      - name: Run automation contract regressions
        if: steps.changes.outputs.any_changed == 'true'
        run: python3 ./scripts/ci/test-automation-contracts.py

      - name: Verify TypeScript package
        if: steps.changes.outputs.typescript_changed == 'true'
        env:
          TIDAS_TOOLS_SOURCE_MODE: auto
          TIDAS_TOOLS_PATH: ${{ steps.upstream.outputs.path }}
          TIDAS_TOOLS_SHA: ${{ steps.upstream.outputs.resolved_sha }}
        run: ./scripts/ci/verify-typescript-package.sh

      - name: Verify Python package
        if: steps.changes.outputs.python_changed == 'true'
        env:
          TIDAS_TOOLS_SOURCE_MODE: auto
          TIDAS_TOOLS_PATH: ${{ steps.upstream.outputs.path }}
          TIDAS_TOOLS_SHA: ${{ steps.upstream.outputs.resolved_sha }}
        run: ./scripts/ci/verify-python-package.sh

      - name: Collect release metadata
        if: steps.changes.outputs.any_changed == 'true'
        id: metadata
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          outputs_path = Path(os.environ["GITHUB_OUTPUT"])
          ts_version = json.loads(Path("sdks/typescript/package.json").read_text(encoding="utf-8"))["version"]
          pyproject = Path("sdks/python/pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version = "(?P<version>\d+\.\d+\.\d+)"$', pyproject)
          if match is None:
              raise SystemExit("error: could not locate Python package version")
          py_version = match.group("version")

          with outputs_path.open("a", encoding="utf-8") as fh:
              fh.write(f"typescript_version={ts_version}\n")
              fh.write(f"python_version={py_version}\n")
          PY

      - name: Compose pull request body
        if: steps.changes.outputs.any_changed == 'true'
        id: pr_body
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.resolved_sha }}
          SOURCE_EVENT: ${{ steps.request.outputs.source_event }}
          SPEC_VERSION: ${{ steps.request.outputs.spec_version }}
          SPEC_SOURCE_COMMIT: ${{ steps.request.outputs.spec_source_commit }}
          SPEC_ARCHIVE_SHA256: ${{ steps.request.outputs.spec_archive_sha256 }}
          SPEC_MANIFEST_SHA256: ${{ steps.request.outputs.spec_manifest_sha256 }}
          SPEC_EVENT_KEY: ${{ steps.request.outputs.spec_event_key }}
          REQUEST_REASON: ${{ steps.request.outputs.reason }}
          TYPESCRIPT_CHANGED: ${{ steps.changes.outputs.typescript_changed }}
          PYTHON_CHANGED: ${{ steps.changes.outputs.python_changed }}
          TYPESCRIPT_VERSION: ${{ steps.metadata.outputs.typescript_version }}
          PYTHON_VERSION: ${{ steps.metadata.outputs.python_version }}
          TYPESCRIPT_BUMP: ${{ steps.request.outputs.typescript_bump }}
          PYTHON_BUMP: ${{ steps.request.outputs.python_bump }}
        run: |
          BODY_DELIMITER="PR_BODY_$(date +%s%N)"
          {
            echo "body<<$BODY_DELIMITER"
            echo "## Summary"
            echo
            echo "- Trigger source: \`$SOURCE_EVENT\`."
            echo "- Resolve the exact tidas-tools checkout at \`$UPSTREAM_SHA\`."
            if [ "$SOURCE_EVENT" = "spec" ]; then
              echo "- Adopt tidas-spec \`$SPEC_VERSION\` from source commit \`$SPEC_SOURCE_COMMIT\`."
              echo "- Archive SHA256: \`$SPEC_ARCHIVE_SHA256\`; manifest SHA256: \`$SPEC_MANIFEST_SHA256\`."
              echo "- Event key: \`$SPEC_EVENT_KEY\`."
            fi
            if [ "$TYPESCRIPT_CHANGED" = "true" ]; then
              echo "- Release TypeScript package \`@tiangong-lca/tidas-sdk\` as \`$TYPESCRIPT_VERSION\` (\`$TYPESCRIPT_BUMP\` bump)."
            fi
            if [ "$PYTHON_CHANGED" = "true" ]; then
              echo "- Release Python package \`tidas-sdk\` as \`$PYTHON_VERSION\` (\`$PYTHON_BUMP\` bump)."
            fi
            if [ -n "$REQUEST_REASON" ]; then
              echo
              echo "## Trigger reason"
              echo
              echo "$REQUEST_REASON"
            fi
            echo
            echo "## Validation"
            echo
            if [ "$TYPESCRIPT_CHANGED" = "true" ]; then
              echo "- \`./scripts/ci/verify-typescript-package.sh\`"
            fi
            if [ "$PYTHON_CHANGED" = "true" ]; then
              echo "- \`./scripts/ci/verify-python-package.sh\`"
            fi
            echo "$BODY_DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update release-prep pull request
        if: steps.changes.outputs.any_changed == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.TIDAS_RELEASE_AUTOMATION_TOKEN }}
          add-paths: |
            sdks/typescript
            sdks/python
            AGENTS.md
            README.md
            .docpact/config.yaml
            docs/agents/repo-validation.md
            docs/agents/repo-architecture.md
            docs/release-setup.md
            docs/upstream-automation.md
            scripts/ci/lib/tidas-tools-source.sh
            scripts/ci/tidas-spec-pin.json
          branch: ${{ steps.upstream.outputs.branch_name }}
          base: main
          delete-branch: false
          commit-message: "chore: sync SDK inputs from ${{ steps.request.outputs.source_event }}"
          title: "chore: sync SDK inputs from ${{ steps.request.outputs.source_event }}"
          body: ${{ steps.pr_body.outputs.body }}
          author: "tidas-sdk automation <actions@github.com>"
          committer: "tidas-sdk automation <actions@github.com>"

      - name: Report pull request
        if: steps.changes.outputs.any_changed == 'true'
        run: |
          echo "Pull request number: ${{ steps.create_pr.outputs.pull-request-number }}"
          echo "Pull request URL: ${{ steps.create_pr.outputs.pull-request-url }}"
